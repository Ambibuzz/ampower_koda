[project]
name = "ampower_koda"
authors = [
    { name = "Ambibuzz Technologies LLP", email = "buzz@ambibuzz.com" }
]
description = "AI Coding Agent for Frappe apps — reads codebase, implements changes, and raises PRs"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-anthropic>=0.3.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.7.0",
    "tomli>=2.0; python_version < \"3.11\"",
]

[project.optional-dependencies]
# check_page (browser verification); also run: playwright install chromium
browser = ["playwright>=1.40"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
