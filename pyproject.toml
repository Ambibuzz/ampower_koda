[project]
name = "ampower_koda"
authors = [
    { name = "Ambibuzz Technologies LLP", email = "buzz@ambibuzz.com" }
]
description = "AI Coding Agent for Frappe apps — reads codebase, implements changes, and raises PRs"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "langgraph>=1.2.10",
    "langchain-openai>=1.3.5",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-anthropic>=1.5.3",
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.7.0",
    "tomli>=2.0; python_version < \"3.11\"",
    # check_page (browser verification); Chromium is downloaded on install and migrate
    "playwright>=1.40",
]

[project.optional-dependencies]
# Kept so existing `pip install ampower_koda[browser]` commands still work.
browser = ["playwright>=1.40"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
